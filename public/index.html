<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groovotheque</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Groovotheque</h1>
  </header>
  <main>
    <div class="index-controls">
      <nav id="breadcrumb" class="breadcrumb" aria-label="Navigation"></nav>
      <div class="search-wrap">
        <div id="search-box" class="search-box">
          <div id="search-chips" class="search-chips"></div>
          <input id="search-input" class="search-input" type="search"
                 placeholder="Rechercher… (# pour un tag)" aria-label="Rechercher un groove"
                 autocomplete="off">
        </div>
        <ul id="search-tag-suggestions" class="tag-suggestions" role="listbox" hidden></ul>
      </div>
    </div>
    <div class="groove-list" id="groove-list">
      <p class="state-msg">Chargement…</p>
    </div>
  </main>
<script type="module" src="/js/app.js"></script>
</body>
</html>
