<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player — Groovotheque</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="load-bar" role="progressbar" aria-label="Chargement des pistes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  <header class="site-header player-header">
    <a id="back-btn" class="back-link" href="/" aria-label="Retour">←</a>
    <nav id="player-breadcrumb" class="breadcrumb breadcrumb--player" aria-label="Navigation"></nav>
    <h1 id="groove-title">…</h1>
    <button id="btn-note" class="nav-btn btn-note" aria-expanded="false" aria-controls="note-panel" title="Menu" aria-label="Menu" hidden>≡</button>
    <button id="btn-prev" class="nav-btn" aria-label="Groove précédent" disabled>‹</button>
    <button id="btn-next" class="nav-btn" aria-label="Groove suivant" disabled>›</button>
    <button id="btn-save-mix" class="btn-save-mix" hidden>Sauvegarder le mix</button>
    <!-- 39.2 — Rendu audio de toutes les pistes MIDI (mode mixte uniquement) -->
    <button id="btn-render-midi" class="btn-render-midi" hidden>⏺ Rendre le MIDI</button>
    <!-- 38.1 — Menu de téléchargement (pistes séparées / mix stéréo) -->
    <div id="download-wrap" class="download-wrap" hidden>
      <button id="btn-download-all" class="btn-download-all"
              aria-haspopup="true" aria-expanded="false" aria-controls="download-menu">↓ Tout télécharger</button>
      <ul id="download-menu" class="download-menu" role="menu" hidden>
        <li role="none"><button type="button" class="download-menu-item" role="menuitem" data-format="zip">Pistes séparées (zip)</button></li>
        <li role="none"><button type="button" class="download-menu-item" role="menuitem" data-format="mp3">Mix stéréo (MP3)</button></li>
        <li role="none"><button type="button" class="download-menu-item" role="menuitem" data-format="flac">Mix stéréo (FLAC)</button></li>
        <li role="none"><button type="button" class="download-menu-item" role="menuitem" data-format="wav">Mix stéréo (WAV)</button></li>
      </ul>
      <span id="download-status" class="download-status" role="status" hidden></span>
    </div>
  </header>
  <!-- 36.3 — Tags du groove -->
  <div id="tags-bar" class="tags-bar" hidden>
    <div id="tags-chips" class="tags-chips"></div>
    <div class="tag-add-wrap">
      <input id="tag-add-input" class="tag-add-input" type="text"
             placeholder="Ajouter un tag…" maxlength="80" autocomplete="off"
             aria-label="Ajouter un tag">
      <ul id="tag-suggestions" class="tag-suggestions" role="listbox" hidden></ul>
    </div>
    <span id="tags-error" class="tags-error" role="alert" hidden></span>
  </div>
  <div id="note-panel" class="note-panel" role="region" aria-label="Notes"></div>
  <main id="player-main" class="loading">
    <div id="tracks-container" class="tracks-container" hidden>
      <!-- 18.7 — Scrollbar horizontale, visible uniquement quand le zoom > 1×.
           Placée dans le conteneur des pistes pour disparaître avec elles
           (tablature plein écran). -->
      <div id="waveform-scrollbar" class="waveform-scrollbar" hidden aria-hidden="true"
           role="scrollbar" aria-orientation="horizontal" aria-controls="tracks-container"
           aria-label="Position dans le morceau"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="waveform-scrollbar-thumb" class="waveform-scrollbar-thumb"></div>
      </div>
    </div>
  </main>
  <div id="transport-drawer" class="transport-drawer" hidden>
    <button id="transport-handle" class="transport-handle" aria-expanded="true" aria-label="Ouvrir/fermer le transport">
      <span class="transport-handle-pill"></span>
    </button>
    <div id="transport" class="transport">
      <div class="transport-row">
        <button id="btn-loop-go-in"  class="transport-btn transport-btn--marker-nav" aria-label="Région précédente">⏮</button>
        <button id="btn-play" class="transport-btn" aria-label="Lecture / Pause">▶</button>
        <button id="btn-stop" class="transport-btn transport-btn--stop" aria-label="Stop">■</button>
        <button id="btn-loop-go-out" class="transport-btn transport-btn--marker-nav" aria-label="Région suivante">⏭</button>
        <span class="transport-sep" aria-hidden="true">|</span>
        <!-- 18.2 — Zoom horizontal des waveforms -->
        <div class="zoom-controls" role="group" aria-label="Zoom des waveforms">
          <button id="btn-zoom-out" class="zoom-btn" type="button" aria-label="Dézoomer" title="Dézoomer" disabled>
            <svg class="zoom-icon" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
              <circle cx="7.5" cy="7.5" r="5"></circle>
              <path d="M11.3 11.3 L16 16"></path>
              <path d="M5 7.5 H10"></path>
            </svg>
          </button>
          <button id="btn-zoom-level" class="zoom-level-btn" type="button"
                  title="Cliquer pour revenir à 1×" aria-label="Niveau de zoom : 1×">1×</button>
          <button id="btn-zoom-in" class="zoom-btn" type="button" aria-label="Zoomer" title="Zoomer">
            <svg class="zoom-icon" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
              <circle cx="7.5" cy="7.5" r="5"></circle>
              <path d="M11.3 11.3 L16 16"></path>
              <path d="M5 7.5 H10"></path>
              <path d="M7.5 5 V10"></path>
            </svg>
          </button>
        </div>
        <!-- Les commentaires ne sont révélés qu'une fois chargés : le séparateur
             qui les précède vit dans le même groupe pour apparaître avec eux. -->
        <div id="transport-comments" class="transport-comments" hidden>
          <span class="transport-sep" aria-hidden="true">|</span>
          <button id="btn-add-comment" class="transport-btn transport-btn--marker-nav" aria-label="Ajouter un commentaire" title="Ajouter un commentaire">✚</button>
          <button id="btn-toggle-comments" class="transport-btn btn-comments" aria-label="Afficher/masquer les commentaires" aria-pressed="true" title="Commentaires">
            💬<span id="comment-badge" class="comment-badge" hidden>0</span>
          </button>
        </div>
        <!-- Le séparateur reste solidaire du temps pour ne pas se retrouver
             seul en fin de ligne quand la rangée se replie. -->
        <div class="transport-time-group">
          <span class="transport-sep" aria-hidden="true">|</span>
          <div class="transport-time">
            <span id="timecode" class="timecode">0:00.000</span>
            <span class="timecode-sep">/</span>
            <span id="duration" class="timecode timecode--dim">—</span>
            <button id="btn-time-mode" class="timecode-toggle" title="Basculer mesure:temps (BBT) / mm:ss" aria-pressed="false" hidden>m:s</button>
          </div>
        </div>
        <div id="seek-bar" class="seek-bar" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="seek-fill" class="seek-fill"></div>
        </div>
        <div class="transport-loop">
          <span class="loop-label">IN</span>
          <input id="loop-in" class="loop-input" type="text" value="—" aria-label="Point IN" disabled>
          <span class="loop-label">OUT</span>
          <input id="loop-out" class="loop-input" type="text" value="—" aria-label="Point OUT" disabled>
          <button id="btn-loop" class="transport-btn transport-btn--loop" aria-label="Boucle" aria-pressed="false">⟳</button>
          <button id="btn-loop-clear" class="transport-btn transport-btn--loop-clear" aria-label="Supprimer la boucle" disabled>✕</button>
        </div>
      </div>
      <div class="transport-row transport-row--tempo">
        <span class="tempo-label">TEMPO</span>
        <span id="tempo-badge" class="tempo-badge" hidden></span>
        <input id="tempo-slider" type="range" min="50" max="120" step="1" value="100"
               class="tempo-slider" aria-label="Tempo (50%–120%)">
        <span id="tempo-value" class="tempo-value">100%</span>
        <div class="tempo-presets">
          <button class="tempo-preset" data-value="50">50%</button>
          <button class="tempo-preset" data-value="75">75%</button>
          <button class="tempo-preset" data-value="90">90%</button>
          <button class="tempo-preset" data-value="100">100%</button>
          <button class="tempo-preset" data-value="110">110%</button>
          <button class="tempo-preset" data-value="120">120%</button>
        </div>
      </div>
    </div>
  </div>
  <!-- 13.2 — Tablature drawer (desktop only, visible si tabFile présent) -->
  <div id="tab-drawer" class="tab-drawer tab-drawer--strip" hidden>
    <div id="tab-handle" class="tab-handle" title="Redimensionner la tablature">
      <div class="tab-handle-grip"></div>
      <div class="tab-drawer-header">
        <span class="tab-drawer-title">Tablature</span>
        <div id="tab-track-list" class="tab-track-list"></div>
        <button id="btn-tab-scroll-resume" class="tab-btn tab-btn--resume"
                title="Reprendre le défilement automatique de la tablature" hidden>⤓ défilement</button>
        <button id="btn-tab-fullscreen" class="tab-btn tab-btn--state"        title="Plein écran" aria-pressed="false">⛶</button>
        <button id="btn-tab-strip"     class="tab-btn tab-btn--state active" title="Strip"       aria-pressed="true">▬</button>
        <button id="btn-tab-collapse"  class="tab-btn tab-btn--state"        title="Réduire"     aria-pressed="false">−</button>
      </div>
    </div>
    <div id="tab-content" class="tab-content"></div>
  </div>
  <!-- 22 — Comment creation modal -->
  <div id="comment-modal-backdrop" class="comment-modal-backdrop" hidden>
    <div class="comment-modal" role="dialog" aria-modal="true" aria-labelledby="comment-modal-title">
      <h2 id="comment-modal-title">Nouveau commentaire</h2>
      <p id="comment-modal-position" class="comment-modal-position">Position : —</p>
      <textarea id="comment-modal-text" class="comment-modal-textarea"
                placeholder="Votre commentaire…" maxlength="1000"></textarea>
      <!-- 37.5 — Signature du rédacteur -->
      <div class="comment-modal-signature">
        <p id="comment-modal-signed" class="comment-signed" hidden>
          signé <strong id="comment-modal-signed-name"></strong>
          <button id="comment-modal-edit-name" class="comment-signed-edit" type="button">modifier</button>
        </p>
        <input id="comment-modal-name" class="comment-name-input" type="text"
               placeholder="Votre prénom…" maxlength="50" autocomplete="given-name" hidden>
      </div>
      <div class="comment-modal-footer">
        <button id="comment-modal-cancel" class="comment-modal-cancel">Annuler</button>
        <button id="comment-modal-submit" class="comment-modal-submit" disabled>Envoyer</button>
      </div>
    </div>
  </div>
  <!-- 37.5 — Demande du prénom à la première rédaction (réponses) -->
  <div id="author-name-backdrop" class="comment-modal-backdrop" hidden>
    <div class="comment-modal" role="dialog" aria-modal="true" aria-labelledby="author-name-title">
      <h2 id="author-name-title">Votre prénom</h2>
      <p class="comment-modal-hint">Il signera vos messages pour les distinguer de ceux des autres membres du groupe.</p>
      <input id="author-name-input" class="comment-name-input" type="text"
             placeholder="Prénom…" maxlength="50" autocomplete="given-name">
      <div class="comment-modal-footer">
        <button id="author-name-cancel" class="comment-modal-cancel">Annuler</button>
        <button id="author-name-submit" class="comment-modal-submit" disabled>Valider</button>
      </div>
    </div>
  </div>
  <!-- 22 — Comment popover (singleton) -->
  <div id="comment-popover" class="comment-popover" hidden>
    <button class="comment-popover-close" aria-label="Fermer">×</button>
    <div class="comment-popover-header">
      <div class="comment-popover-initials" id="cp-initials"></div>
      <div class="comment-popover-meta">
        <span class="comment-popover-author" id="cp-author"></span>
        <span class="comment-popover-pos" id="cp-pos"></span>
      </div>
    </div>
    <div class="comment-popover-text" id="cp-text"></div>
    <div class="comment-popover-date" id="cp-date"></div>
    <div class="comment-popover-replies" id="cp-replies"></div>
    <div class="comment-popover-reply-form">
      <input type="text" class="comment-popover-reply-input" id="cp-reply-input"
             placeholder="Répondre…" maxlength="500">
      <button class="comment-popover-reply-send" id="cp-reply-send">Envoyer</button>
    </div>
    <div class="comment-popover-actions" id="cp-actions" hidden></div>
  </div>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
